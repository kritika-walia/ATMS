// ================= LOAD DATA =================
// ================= LOAD DATA =================
async function loadData(){

  const { data, error } = await supabaseClient
    .from("atms_forms")
    .select("*");

  if(error){
    alert("Error loading data");
    console.log(error);
    return;
  }

  const tbody = document.querySelector("#dataTable tbody");
  tbody.innerHTML = "";

  data.forEach(row => {

    const monthly = row.monthly || [];

    // 👉 show latest entry (last one)
    const last = monthly[monthly.length - 1] || {};

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${row.ro || ""}</td>
      <td>${row.piu || ""}</td>
      <td>${row.upc || ""}</td>
      <td>${row.project_title || ""}</td>
      <td>${row.ofc?.status || ""}</td>
      <td>${row.ofc?.length || ""}</td>
      <td>${row.ofc?.core || ""}</td>
      <td>${last.challan_count || ""}</td>
      <td>${last.ambulance_count || ""}</td>
      <td>${row.si_name || ""}</td>
    `;

    tbody.appendChild(tr);
  });

}

loadData();


// ================= EXPORT CSV =================
async function exportToCSV(){

  const { data } = await supabaseClient
    .from("atms_forms")
    .select("*");

  let rows = [];

  data.forEach(item => {

    const monthly = item.monthly || [];

    monthly.forEach(m => {

      rows.push({
        ro: item.ro,
        piu: item.piu,
        upc: item.upc,
        project: item.project_title,

        ofc_status: item.ofc?.status,
        ofc_length: item.ofc?.length,
        ofc_core: item.ofc?.core,

        challan_month: m.challan_month,
        challan_year: m.challan_year,
        challan_count: m.challan_count,

        ambulance_month: m.ambulance_month,
        ambulance_year: m.ambulance_year,
        ambulance_count: m.ambulance_count,

        si_name: item.si_name,
        spoc: item.spoc_name
      });

    });

  });

  const headers = Object.keys(rows[0]);

  const csv = [
    headers.join(","),
    ...rows.map(r => headers.map(h => `"${r[h] || ""}"`).join(","))
  ].join("\n");

  const blob = new Blob([csv], { type: "text/csv" });
  const url = window.URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "ATMS_Data.csv";
  a.click();
}
  // DOWNLOAD
  const blob = new Blob([csv.join("\n")], { type: "text/csv" });
  const url = window.URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "ATMS_Data.csv";
  a.click();
}

</script>
