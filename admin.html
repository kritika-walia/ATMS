// ================= EXPORT CSV =================
async function exportToCSV() {

  const { data } = await supabaseClient
    .from("atms_forms")
    .select("*");

  let rows = [];

  data.forEach(item => {

    const equipmentText = (item.equipment || [])
      .map(e => `${e.component}: ${e.working}/${e.installed}`)
      .join(" | ");

   let monthly = item.monthly;

if (typeof monthly === "string") {
  try {
    monthly = JSON.parse(monthly);
  } catch {
    monthly = [];
  }
}

if (!Array.isArray(monthly)) monthly = [];

    monthly.forEach(m => {

      rows.push({
        RO: item.ro,
        PIU: item.piu,
        UPC: item.upc,
        Project: item.project_title,

        Length: item.length,
        Lanes: item.lanes,
        ATMS_Status: item.atms_status,

        OFC_Status: item.ofc?.status,
        OFC_Length: item.ofc?.length,
        OFC_Core: item.ofc?.core,

        Equipment: equipmentText,

        Operational_Since: item.operational?.since,
        Operational_Status: item.operational?.status,

        Challan_Month: m.challan_month,
        Challan_Year: m.challan_year,
        Challan_Count: m.challan_count,

        Ambulance_Month: m.ambulance_month,
        Ambulance_Year: m.ambulance_year,
        Ambulance_Count: m.ambulance_count,

        Vendor_Name: item.si_name,
        Vendor_Address: item.si_address,
        Contact_Person: item.spoc_name,
        Contact_Email: item.spoc_email,
        Contact_Number: item.spoc_phone,
      });

    });

  });

  const headers = Object.keys(rows[0]);

  const csv = [
    headers.join(","),
    ...rows.map(r => headers.map(h => `"${r[h] || ""}"`).join(","))
  ].join("\n");

  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = `ATMS_Report_${new Date().toISOString().split("T")[0]}.csv`;
  a.click();
}
