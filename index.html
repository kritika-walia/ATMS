<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATMS Data Collection Form</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{background:#f4f7fb;font-family:Arial;}
.header-box{background:linear-gradient(135deg,#003366,#0059b3);color:white;padding:20px;border-radius:14px;margin-bottom:25px;}
.card-box{background:white;border-radius:14px;padding:25px;box-shadow:0 4px 14px rgba(0,0,0,0.08);margin-bottom:20px;}
.section-title{font-size:20px;font-weight:700;color:#003366;margin-bottom:18px;border-bottom:2px solid #e8eef7;padding-bottom:8px;}
.small-note{font-size:12px;color:#6c757d;margin-top:4px;}
::placeholder{color:#9aa0a6 !important;}
</style>
</head>

<body>
<div class="container my-4">

<!-- HEADER -->
<div class="header-box text-center">
<h2>ATMS Data Collection Form</h2>
<p>Advanced Traffic Management System Monitoring Portal</p>
</div>

<!-- SECTION 1 -->
<div class="card-box">
<div class="section-title">1. Project & Location Fields</div>

<div class="row g-3">

<div class="col-md-4">
<label>RO</label>
<input name="ro" type="text" class="form-control" placeholder="Delhi, Mumbai">
</div>

<div class="col-md-4">
<label>PIU</label>
<input name="piu" type="text" class="form-control" placeholder="PIU Gurgaon">
</div>

<div class="col-md-4">
<label>UPC Code</label>
<select id="upcDropdown" class="form-control">
<option value="">Select UPC</option>
</select>
</div>

<div class="col-md-8">
<label>Highway / Stretch</label>
<input type="text" class="form-control" placeholder="NH-48 Delhi-Gurgaon">
</div>

<div class="col-md-4">
<label>Length (KM)</label>
<input name="length" type="number" min="0" step="0.01" class="form-control">
</div>

</div>
</div>

<!-- SUBMIT -->
<div class="text-center mt-4">
<button class="btn btn-success" onclick="submitForm()">Submit</button>
</div>

</div>

<!-- ================= JS ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabase = window.supabase.createClient(
  "https://evhencgqdjwzqghaimut.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV2aGVuY2dxZGp3enFnaGFpbXV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NDY4MjMsImV4cCI6MjA5MzAyMjgyM30.kyJzXYsANeFsfAxbdbmXxRjRTqN4EKs3J7qiX0tHIaI"
);

// Load UPC dropdown
async function loadUPC() {
  const { data } = await supabase
    .from("master_projects")
    .select("upc");

  const dropdown = document.getElementById("upcDropdown");

  data.forEach(item => {
    let opt = document.createElement("option");
    opt.value = item.upc;
    opt.textContent = item.upc;
    dropdown.appendChild(opt);
  });
}

// Auto-fill
document.getElementById("upcDropdown").addEventListener("change", async function() {

  const selectedUPC = this.value;

  const { data } = await supabase
    .from("master_projects")
    .select("*")
    .eq("upc", selectedUPC)
    .single();

  if (data) {
    document.querySelector("[name='ro']").value = data.implementing_ro || "";
    document.querySelector("[name='piu']").value = data.piu || "";
    document.querySelector("[name='length']").value = data.length || "";
  }
});

// Prevent negative
document.addEventListener("input", function(e){
  if(e.target.type === "number" && e.target.value < 0){
    e.target.value = 0;
  }
});

// Submit
function submitForm(){
  alert("Form submitted successfully!");
}

loadUPC();
</script>

</body>
</html>
